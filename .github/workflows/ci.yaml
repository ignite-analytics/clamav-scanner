name: Continuous Integration

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      pulumi: ${{ steps.filter.outputs.pulumi }}
      helm: ${{ steps.filter.outputs.helm }}
      opentofu: ${{ steps.filter.outputs.opentofu }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          list-files: shell
          filters: |
            changed:
              - '!infrastructure/**'
            pulumi:
              - 'infrastructure/pulumi/**'
            helm:
              - 'infrastructure/helm/**'
            opentofu:
              - 'infrastructure/opentofu/**'

  test:
    name: Test
    needs:
      - meta
    if: needs.meta.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      VERBOSE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --timeout 5m0s
          skip-cache: false

      - name: Format go files
        run: go fmt ./...

      - name: Vet go files
        run: go vet ./...

      - name: Verify dependency tree
        run: go mod verify

      - name: Run Gosec Security Scanner
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: ./...

      - name: Run tests
        run: go test -v ./...

  pulumi:
    name: Pulumi
    needs:
      - meta
    if: needs.meta.outputs.pulumi == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./infrastructure/pulumi
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: infrastructure/pulumi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint typescript files
        run: npm run lint

      - name: Run tests
        run: npm test

  helm:
    name: Helm
    needs:
      - meta
    if: needs.meta.outputs.helm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./infrastructure/helm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Helm documentation
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          chart-search-root: infrastructure/helm
          git-push: false

      - name: Check values schema json
        uses: losisin/helm-values-schema-json-action@9ed68d9d464a5e6f7f5fc1f3dc071828cf7d13a2 # v3.2.0
        with:
          working-directory: infrastructure/helm
          fail-on-diff: true
          git-push: false

      - name: Lint helm chart
        run: helm lint . -f values.yaml --debug

      - name: Helm unit tests
        shell: bash
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git
          helm unittest . --failfast --strict --debug --color

  opentofu:
    name: OpenTofu
    needs:
      - meta
    if: needs.meta.outputs.opentofu == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./infrastructure/opentofu
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.7.1

      - name: OpenTofu fmt
        id: fmt
        run: tofu fmt -check

      - name: OpenTofu Init
        id: init
        run: tofu init

      - name: OpenTofu Validate
        id: validate
        run: tofu validate
